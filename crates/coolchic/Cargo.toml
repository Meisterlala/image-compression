[package]
name = "coolchic"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "CPU-only experimental Cool-chic 5.0 image profile"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
constriction = "=0.4.2"
probability = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
