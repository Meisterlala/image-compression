[package]
name = "coolchic"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Browser-portable Cool-chic v5 reference RGB codec and intra MSE trainer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
constriction = "=0.4.2"
probability = "0.20"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
